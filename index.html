<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داريا للمطاعم | Daria Restaurants</title>
    
    <!-- خط Cairo من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- أيقونات Font Awesome (اختیاري للأيقونات) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* المتغيرات والألوان الأساسية */
        :root {
            --primary-gold: #c5a059;
            --primary-gold-hover: #e0b86c;
            --dark-brown: #1a1412;
            --light-cream: #f9f6f0;
            --card-bg: rgba(26, 20, 18, 0.75);
            --border-color: rgba(197, 160, 89, 0.3);
            --text-light: #ffffff;
            --text-muted: #d1c7bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-brown);
            background-image: radial-gradient(circle at center, rgba(197, 160, 89, 0.15) 0%, rgba(26, 20, 18, 0.95) 100%),
                              url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c5a059' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* حاوية البطاقة الرئيسية */
        .card-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* زر تغيير اللغة */
        .lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(197, 160, 89, 0.15);
            border: 1px solid var(--border-color);
            color: var(--primary-gold);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-switch:hover {
            background: var(--primary-gold);
            color: var(--dark-brown);
        }

        /* إطار الشعار والصورة */
        .logo-frame {
            width: 110px;
            height: 110px;
            margin: 10px auto 20px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            padding: 4px;
            background: rgba(197, 160, 89, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* عناوين المطعم */
        .title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary-gold);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* قائمة الروابط */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 14px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-btn i {
            color: var(--primary-gold);
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .link-btn:hover {
            background: var(--primary-gold);
            color: var(--dark-brown);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.25);
        }

        .link-btn:hover i {
            color: var(--dark-brown);
        }

        /* روابط التواصل الاجتماعي */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .social-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: var(--primary-gold);
            color: var(--dark-brown);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <main class="card-container">
        <!-- زر تبديل اللغة -->
        <button class="lang-switch" onclick="toggleLanguage()">EN</button>

        <!-- الشعار -->
        <div class="logo-frame">
            <img src="https://via.placeholder.com/150/1a1412/c5a059?text=Daria" alt="شعار مطعم داريا">
        </div>

        <!-- معلومات المطعم -->
        <h1 class="title">مطاعم داريا</h1>
        <p class="subtitle">تجربة طهي استثنائية وأصالة لا تُنسى</p>

        <!-- قائمة الأزرار التفاعلية -->
        <nav class="links-wrapper">
            <a href="#" class="link-btn">
                <span>قائمة الطعام (المنيو)</span>
                <i class="fa-solid fa-utensils"></i>
            </a>
            <a href="#" class="link-btn">
                <span>حجز طاولة</span>
                <i class="fa-solid fa-calendar-check"></i>
            </a>
            <a href="#" class="link-btn">
                <span>موقعنا على الخريطة</span>
                <i class="fa-solid fa-location-dot"></i>
            </a>
            <a href="#" class="link-btn">
                <span>التواصل عبر الواتساب</span>
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </nav>

        <!-- روابط التواصل الاجتماعي -->
        <div class="social-links">
            <a href="#" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="social-icon" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" class="social-icon" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
        </div>
    </main>

    <script>
        function toggleLanguage() {
            // وظيفة تبديل اللغة المستقبلي
            alert('سيتم إضافة دعم اللغة الإنجليزية قريباً');
        }
    </script>
</body>
</html>
